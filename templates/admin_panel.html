<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: Arial, Helvetica, sans-serif; background-color: #e9ecf1; margin: 0; padding: 0; display: flex; justify-content: center; min-height: 100vh; }
        .main { width: 1200px; margin: 20px 0; }
        .header { background-color: #002147; color: white; padding: 20px; border-radius: 20px 20px 0 0; text-align: center; box-sizing: border-box; }
        .header h1 { margin: 5px 0; font-size: 22px; }
        .logo-container { display: flex; justify-content: space-between; align-items: center; }
        .left-logo, .right-logo { width: 100px; height: auto; }
        .title { text-align: center; flex-grow: 1; padding: 0 20px; }
        .container { padding: 40px 20px; background-color: white; border-radius: 0 0 8px 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); min-height: 500px; position: relative; box-sizing: border-box; }
        .top-buttons { position: absolute; top: 20px; right: 20px; display: flex; gap: 20px; }
        .top-buttons a { color: #333; text-decoration: none; font-size: 24px; }
        .top-buttons a:hover i { color: #0056b3; transform: scale(1.2); }
        h2 { text-align: center; color: #002147; margin-bottom: 40px; font-size: 26px; }
        .dashboard-cards { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-top: 40px; }
        .card { background: #f8f9fa; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); padding: 40px 30px; text-align: center; width: 220px; text-decoration: none; color: #002147; transition: transform 0.2s, box-shadow 0.2s; border-top: 5px solid #002147; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .card i { font-size: 40px; margin-bottom: 15px; display: block; color: #0056b3; }
        .card span { font-size: 16px; font-weight: bold; }
        .bottom-buttons { display: flex; justify-content: center; gap: 20px; margin-top: 60px; }
        .btn-history { background-color: #0056b3; color: white; padding: 10px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .btn-logout { background-color: #6c757d; color: white; padding: 10px 25px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .btn-history:hover { background-color: #003d7a; }
        .btn-logout:hover { background-color: #545b62; }
        .footer { background-color: #002147; color: white; padding: 20px; border-radius: 0 0 20px 20px; text-align: center; box-sizing: border-box; }
    </style>
</head>
<body>
<div class="main">
    <div class="header">
        <div class="logo-container">
            <img src="{{ url_for('static', filename='images/iisc_logo.png') }}" alt="Institute Logo" class="left-logo">
            <div class="title"><h1>ADVANCED CENTRE FOR CRYO ELECTRON MICROSCOPY</h1></div>
            <img src="{{ url_for('static', filename='images/cryo.png') }}" alt="Cryo-EM Logo" class="right-logo">
        </div>
    </div>

    <div class="container">
        <div class="top-buttons">
            <a href="{{ url_for('public.home') }}" title="Home"><i class="fas fa-home"></i></a>
        </div>

        <h2>Admin Dashboard</h2>

        <div class="dashboard-cards">
            <a href="{{ url_for('admin.datacollecting') }}" class="card">
                <i class="fas fa-database"></i>
                <span>Data Collecting</span>
            </a>
            <a href="{{ url_for('admin.freezing_admin') }}" class="card">
                <i class="fas fa-snowflake"></i>
                <span>Freezing</span>
            </a>
            <a href="{{ url_for('admin.screening_admin') }}" class="card">
                <i class="fas fa-microscope"></i>
                <span>Screening</span>
            </a>
        </div>

        <div class="bottom-buttons">
            <a href="{{ url_for('admin.history') }}" class="btn-history">View History</a>
            <a href="{{ url_for('admin.logout') }}" class="btn-logout">Logout</a>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2025 Advanced Centre for Cryo Electron Microscopy</p>
    </div>
</div>
</body>
</html>
